<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="计算器">
<meta name="theme-color" content="#000000">
<title>计算器</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"计算器","short_name":"计算器","start_url":".","display":"fullscreen","orientation":"portrait","background_color":"%23000000","theme_color":"%23000000"}'>
<style>
  :root {
    --vh: 100vh;
  }
  @supports (height: 1dvh) {
    :root { --vh: 100dvh; }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; overflow: hidden;
    position: fixed; inset: 0; width: 100%;
  }

  /* ===== 容器：严格按 iPhone 13 的 390 x 844 比例 ===== */
  .calc {
    /* --u = 1pt 在当前容器中的实际像素；设计基准宽度 390pt */
    --u: calc(min(100vw, calc(var(--vh) * 390 / 844)) / 390);
    width: calc(var(--u) * 390);
    aspect-ratio: 390 / 844;
    position: relative;
    display: flex; flex-direction: column;
    background: #000;
    padding:
      calc(env(safe-area-inset-top) + calc(var(--u) * 8))
      calc(var(--u) * 8)
      calc(env(safe-area-inset-bottom) + calc(var(--u) * 12));
  }

  /* 设置按钮：左上角，避开右对齐数字 */
  .settings-btn {
    position: absolute;
    top: calc(env(safe-area-inset-top) + calc(var(--u) * 10));
    left: calc(var(--u) * 14);
    width: calc(var(--u) * 30);
    height: calc(var(--u) * 30);
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    color: #7d7d82;
    font-size: calc(var(--u) * 15);
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    border: 0;
  }
  .settings-btn:active { filter: brightness(1.5); }

  /* 显示区：占据键盘上方全部空间，数字底部右对齐 */
  .display-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: calc(var(--u) * 44) calc(var(--u) * 8) calc(var(--u) * 10);
    overflow: hidden;
  }
  .display {
    width: 100%;
    max-width: 100%;
    text-align: right;
    font-weight: 300;
    line-height: 1.05;
    letter-spacing: -0.5px;
    white-space: nowrap;
    overflow: hidden;
    /* JS 会按容器宽度覆盖 */
    font-size: calc(var(--u) * 90);
    flex: 0 0 auto;
  }

  /* 键盘：4 列，gap 12pt，按钮填满列宽 */
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: calc(var(--u) * 12);
    flex: 0 0 auto;
  }
  .keys button {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 0; padding: 0;
    font-family: inherit;
    font-size: calc(var(--u) * 34);
    font-weight: 400;
    color: #fff; background: #333;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: filter .12s;
  }
  .keys button:active { filter: brightness(1.4); }

  .keys button.fn {
    background: #a5a5a5; color: #000;
    font-size: calc(var(--u) * 28);
  }
  .keys button.fn:active { filter: brightness(1.15); }

  .keys button.op {
    background: #ff9f0a;
    font-size: calc(var(--u) * 38);
  }
  .keys button.op:active { filter: brightness(1.15); }

  /* 0 键：跨两列，胶囊形，高度跟本行一致 */
  .keys button.zero {
    grid-column: span 2;
    aspect-ratio: auto;
    border-radius: 999px;
    justify-content: flex-start;
    padding-left: 22%;
    height: 100%;
    align-self: stretch;
  }

  /* ===== 设置面板（独立弹窗，用固定 px 即可） ===== */
  .settings-panel {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.72);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .settings-panel.hidden { display: none; }
  .settings-card {
    width: 100%; max-width: 320px;
    background: #1c1c1e;
    border-radius: 20px;
    padding: 20px;
  }
  .settings-card h3 {
    font-size: 17px; font-weight: 600;
    margin-bottom: 14px; text-align: center;
  }
  .settings-card input {
    width: 100%; height: 48px;
    background: #2c2c2e;
    border: 0; border-radius: 12px;
    color: #fff; font-size: 20px;
    text-align: center;
    letter-spacing: 1px;
    outline: none;
    font-family: inherit;
  }
  .settings-actions {
    display: flex; gap: 10px; margin-top: 14px;
  }
  .settings-actions button {
    flex: 1;
    width: auto; height: 44px;
    border: 0; border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
  }
  #cancelBtn { background: #3a3a3c; color: #fff; }
  #saveBtn { background: #ff9f0a; color: #000; font-weight: 600; }
  .settings-tip {
    font-size: 12px; color: #8a8a8e;
    text-align: center; margin-top: 10px; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="calc">
  <button id="settingsBtn" class="settings-btn" aria-label="设置">⚙</button>

  <div class="display-wrap">
    <div id="display" class="display">0</div>
  </div>

  <div class="keys">
    <button class="fn" data-key="AC">AC</button>
    <button class="fn" data-key="sign">+/−</button>
    <button class="fn" data-key="percent">%</button>
    <button class="op" data-key="/">÷</button>

    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>
    <button class="op" data-key="*">×</button>

    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>
    <button class="op" data-key="-">−</button>

    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button class="op" data-key="+">+</button>

    <button class="zero" data-key="0">0</button>
    <button data-key=".">.</button>
    <button class="op" data-key="=">=</button>
  </div>
</div>

<div id="settingsPanel" class="settings-panel hidden">
  <div class="settings-card">
    <h3>设置目标数字</h3>
    <input id="targetInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="例如 2026021622">
    <div class="settings-actions">
      <button id="cancelBtn">取消</button>
      <button id="saveBtn">保存</button>
    </div>
    <p class="settings-tip">只填数字，位数决定倒扣后要按几下<br>（当前目标位数 = 盲按次数）</p>
  </div>
</div>

<script>
  const STORAGE_KEY = 'magic_calc_target_v1';
  const DEFAULT_TARGET = '2026021622';
  const PAD_DIFF_TO_TARGET_LENGTH = true;

  const displayEl = document.getElementById('display');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const targetInput = document.getElementById('targetInput');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const calcEl = document.querySelector('.calc');

  let TARGET_DISPLAY = loadTarget();
  let TARGET_LEN = TARGET_DISPLAY.length;

  function loadTarget() {
    try {
      const v = localStorage.getItem(STORAGE_KEY);
      if (v && /^\d{1,16}$/.test(v)) return v;
    } catch (e) {}
    return DEFAULT_TARGET;
  }
  function saveTarget(v) {
    try { localStorage.setItem(STORAGE_KEY, v); } catch (e) {}
  }

  let phase = 'A';
  let a = '', b = '';
  let sum = 0;
  let diffStr = '';
  let blindCount = 0;

  // 按容器实际宽度等比缩放字号：390 宽下最大 90px
  function fitDisplay() {
    const el = displayEl;
    const calcWidth = calcEl.clientWidth;
    if (!calcWidth) return;
    const maxSize = calcWidth * (90 / 390);
    let size = maxSize;
    el.style.fontSize = size + 'px';
    const avail = el.clientWidth;
    if (!avail) return;
    let guard = 0;
    while (el.scrollWidth > avail && size > 14 && guard < 120) {
      size -= 1;
      el.style.fontSize = size + 'px';
      guard++;
    }
  }

  function setDisplay(text) {
    displayEl.textContent = text;
    fitDisplay();
  }

  function reset() {
    phase = 'A'; a = ''; b = ''; sum = 0; diffStr = ''; blindCount = 0;
    setDisplay('0');
  }

  function press(key) {
    if (key === 'AC') {
      if (phase === 'blindReady' || phase === 'blind') return;
      reset();
      return;
    }
    if (key === '+') {
      if (phase === 'A' && a !== '') {
        phase = 'B';
        setDisplay(a);
      }
      return;
    }
    if (key === '=') {
      if (phase === 'B' && a !== '' && b !== '') {
        sum = parseInt(a, 10) + parseInt(b, 10);
        const diffNum = Number(TARGET_DISPLAY) - sum;
        if (diffNum < 0) {
          diffStr = TARGET_DISPLAY;
        } else {
          diffStr = String(diffNum);
          if (PAD_DIFF_TO_TARGET_LENGTH) diffStr = diffStr.padStart(TARGET_LEN, '0');
        }
        phase = 'blindReady';
        setDisplay(String(sum));
        return;
      }
      if (phase === 'blindReady' || phase === 'blind') {
        setDisplay(TARGET_DISPLAY);
        phase = 'done';
        return;
      }
      return;
    }
    if (/^\d$/.test(key)) {
      if (phase === 'A') {
        a = a === '' ? key : (a === '0' ? key : a + key);
        setDisplay(a);
        return;
      }
      if (phase === 'B') {
        b = b === '' ? key : (b === '0' ? key : b + key);
        setDisplay(b);
        return;
      }
      if (phase === 'blindReady') {
        phase = 'blind'; blindCount = 1;
        setDisplay(diffStr.slice(0, Math.min(blindCount, diffStr.length)));
        return;
      }
      if (phase === 'blind') {
        blindCount++;
        setDisplay(diffStr.slice(0, Math.min(blindCount, diffStr.length)));
        return;
      }
    }
  }

  document.querySelector('.keys').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-key]');
    if (!btn) return;
    press(btn.dataset.key);
  });

  function openSettings() {
    reset();
    targetInput.value = TARGET_DISPLAY;
    settingsPanel.classList.remove('hidden');
    setTimeout(() => targetInput.focus(), 50);
  }
  function closeSettings() {
    settingsPanel.classList.add('hidden');
  }
  function applyTarget() {
    const raw = targetInput.value.trim();
    if (!/^\d{1,16}$/.test(raw)) {
      targetInput.value = '';
      targetInput.placeholder = '请输入 1-16 位数字';
      return;
    }
    TARGET_DISPLAY = raw;
    TARGET_LEN = TARGET_DISPLAY.length;
    saveTarget(TARGET_DISPLAY);
    closeSettings();
    reset();
  }

  settingsBtn.addEventListener('click', openSettings);
  cancelBtn.addEventListener('click', closeSettings);
  saveBtn.addEventListener('click', applyTarget);
  targetInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') applyTarget();
    if (e.key === 'Escape') closeSettings();
  });
  settingsPanel.addEventListener('click', (e) => {
    if (e.target === settingsPanel) closeSettings();
  });

  fitDisplay();
  setTimeout(fitDisplay, 50);
  window.addEventListener('resize', fitDisplay);
  window.addEventListener('orientationchange', () => setTimeout(fitDisplay, 150));
</script>
</body>
</html>
