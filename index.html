<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="计算器">
<meta name="theme-color" content="#000000">
<title>计算器</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"计算器","short_name":"计算器","start_url":".","display":"fullscreen","orientation":"portrait","background_color":"%23000000","theme_color":"%23000000"}'>
<style>
  :root { --vh: 100vh; }
  @supports (height: 1dvh) { :root { --vh: 100dvh; } }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; overflow: hidden;
    position: fixed; inset: 0; width: 100%;
  }

  /* ===== 容器：严格按 390 x 844 比例 ===== */
  .calc {
    --u: calc(min(100vw, calc(var(--vh) * 390 / 844)) / 390);
    width: calc(var(--u) * 390);
    aspect-ratio: 390 / 844;
    position: relative;
    display: flex; flex-direction: column;
    background: #000;
    padding:
      calc(env(safe-area-inset-top) + calc(var(--u) * 10))
      calc(var(--u) * 12)
      calc(env(safe-area-inset-bottom) + calc(var(--u) * 12));
  }

  /* ===== 顶部工具按钮（左时钟，右计算器） ===== */
  .top-btn {
    position: absolute;
    top: calc(env(safe-area-inset-top) + calc(var(--u) * 10));
    width: calc(var(--u) * 42);
    height: calc(var(--u) * 42);
    border-radius: 50%;
    background: #333;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    z-index: 10; border: 0; cursor: pointer;
  }
  .top-btn:active { filter: brightness(1.3); }
  .btn-clock { left: calc(var(--u) * 18); }
  .btn-calc { right: calc(var(--u) * 18); }
  .top-btn svg { width: 55%; height: 55%; }

  /* ===== 显示区 ===== */
  .display-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: calc(var(--u) * 60) calc(var(--u) * 6) calc(var(--u) * 12);
    overflow: hidden;
  }
  .display {
    width: 100%; max-width: 100%;
    text-align: right;
    font-weight: 300;
    line-height: 1.1;
    letter-spacing: -1px;
    white-space: nowrap;
    overflow: hidden;
    font-size: calc(var(--u) * 90);
    flex: 0 0 auto;
  }

  /* ===== 键盘：4列5行 ===== */
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: calc(var(--u) * 12);
    flex: 0 0 auto;
  }
  .keys button {
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 0; padding: 0;
    font-family: inherit;
    font-size: calc(var(--u) * 38);
    font-weight: 400;
    color: #fff; 
    background: #333; /* 默认深灰底白字 */
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: filter .1s;
  }
  .keys button:active { filter: brightness(1.3); }

  /* 第一行功能键：浅灰底黑字 */
  .keys button.fn {
    background: #a5a5a5;
    color: #000;
  }

  /* 运算符：橙色 */
  .keys button.op {
    background: #FF9F0A;
    color: #fff;
    font-size: calc(var(--u) * 42);
  }
  .keys button.op:active { filter: brightness(1.15); }

  /* 键盘内的图标大小 */
  .keys button svg { width: 45%; height: 45%; }

  /* ===== 特殊排版的 +/- 键 ===== */
  .sign-btn { font-size: 0 !important; }
  .pm {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--u) * 38);
    line-height: 1;
  }
  .pm-plus { transform: translateY(-12%); margin-right: 1px; }
  .pm-minus { transform: translateY(12%); margin-left: 1px; }
  .pm-slash { font-size: 0.95em; opacity: 0.9; margin: 0 -1px; }

  /* ===== 设置面板 ===== */
  .settings-panel {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  }
  .settings-panel.hidden { display: none; }
  .settings-card {
    width: 100%; max-width: 320px;
    background: #1c1c1e; border-radius: 20px; padding: 20px;
  }
  .settings-card h3 { font-size: 17px; font-weight: 600; margin-bottom: 14px; text-align: center; }
  .settings-card input {
    width: 100%; height: 48px; background: #2c2c2e;
    border: 0; border-radius: 12px; color: #fff; font-size: 20px;
    text-align: center; letter-spacing: 1px; outline: none; font-family: inherit;
  }
  .settings-actions { display: flex; gap: 10px; margin-top: 14px; }
  .settings-actions button {
    flex: 1; width: auto; height: 44px; border: 0; border-radius: 12px;
    font-family: inherit; font-size: 16px; cursor: pointer;
  }
  #cancelBtn { background: #3a3a3c; color: #fff; }
  #saveBtn { background: #FF9F0A; color: #fff; font-weight: 600; }
  .settings-tip { font-size: 12px; color: #8a8a8e; text-align: center; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>
<div class="calc">
  <!-- 顶部图标 -->
  <button class="top-btn btn-clock" aria-label="时钟">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <polyline points="12 6 12 12 16 14"></polyline>
    </svg>
  </button>
  <button id="settingsBtn" class="top-btn btn-calc" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
      <line x1="8" y1="6" x2="16" y2="6"></line>
      <line x1="8" y1="10" x2="8" y2="10.01"></line>
      <line x1="12" y1="10" x2="12" y2="10.01"></line>
      <line x1="16" y1="10" x2="16" y2="10.01"></line>
      <line x1="8" y1="14" x2="8" y2="14.01"></line>
      <line x1="12" y1="14" x2="12" y2="14.01"></line>
      <line x1="16" y1="14" x2="16" y2="14.01"></line>
      <line x1="8" y1="18" x2="16" y2="18"></line>
    </svg>
  </button>

  <div class="display-wrap">
    <div id="display" class="display">0</div>
  </div>

  <!-- 键盘布局 -->
  <div class="keys">
    <!-- 第一行：浅灰底黑字 -->
    <button class="fn" data-key="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
        <line x1="18" y1="9" x2="12" y2="15"></line>
        <line x1="12" y1="9" x2="18" y2="15"></line>
      </svg>
    </button>
    <button class="fn" data-key="AC">AC</button>
    <button class="fn" data-key="percent">%</button>
    <button class="op" data-key="/">÷</button>

    <!-- 数字与运算符 -->
    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>
    <button class="op" data-key="*">×</button>

    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>
    <button class="op" data-key="-">−</button>

    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button class="op" data-key="+">+</button>

    <!-- 最后一行 -->
    <button class="sign-btn" data-key="sign">
      <span class="pm">
        <span class="pm-plus">+</span>
        <span class="pm-slash">/</span>
        <span class="pm-minus">−</span>
      </span>
    </button>
    <button data-key="0">0</button>
    <button data-key=".">.</button>
    <button class="op" data-key="=">=</button>
  </div>
</div>

<div id="settingsPanel" class="settings-panel hidden">
  <div class="settings-card">
    <h3>设置目标数字</h3>
    <input id="targetInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="例如 2026021622">
    <div class="settings-actions">
      <button id="cancelBtn">取消</button>
      <button id="saveBtn">保存</button>
    </div>
    <p class="settings-tip">只填数字，位数决定倒扣后要按几下<br>（当前目标位数 = 盲按次数）</p>
  </div>
</div>

<script>
  const STORAGE_KEY = 'magic_calc_target_v1';
  const DEFAULT_TARGET = '2026021622';
  const PAD_DIFF_TO_TARGET_LENGTH = true;
  const DOUBLE_EQ_MS = 500; // 双击等号的时间窗口(ms)

  const displayEl = document.getElementById('display');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const targetInput = document.getElementById('targetInput');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const calcEl = document.querySelector('.calc');

  let TARGET_DISPLAY = loadTarget();
  let TARGET_LEN = TARGET_DISPLAY.length;

  function loadTarget() {
    try {
      const v = localStorage.getItem(STORAGE_KEY);
      if (v && /^\d{1,16}$/.test(v)) return v;
    } catch (e) {}
    return DEFAULT_TARGET;
  }
  function saveTarget(v) {
    try { localStorage.setItem(STORAGE_KEY, v); } catch (e) {}
  }

  let phase = 'A'; // A: 第一个数  B: 第二个数  blindReady/blind: 盲按  done: 结束
  let a = '', b = '';
  let sum = 0;
  let diffStr = '';
  let blindCount = 0;
  let eqTapTime = 0;

  function fitDisplay() {
    const el = displayEl;
    const calcWidth = calcEl.clientWidth;
    if (!calcWidth) return;
    const maxSize = calcWidth * (90 / 390);
    let size = maxSize;
    el.style.fontSize = size + 'px';
    const avail = el.clientWidth;
    if (!avail) return;
    let guard = 0;
    while (el.scrollWidth > avail && size > 14 && guard < 120) {
      size -= 1;
      el.style.fontSize = size + 'px';
      guard++;
    }
  }

  function setDisplay(text) {
    displayEl.textContent = text;
    fitDisplay();
  }

  function reset() {
    phase = 'A'; a = ''; b = ''; sum = 0; diffStr = ''; blindCount = 0; eqTapTime = 0;
    setDisplay('0');
  }

  function advanceBlind() {
    if (phase === 'blindReady') {
      phase = 'blind';
      blindCount = 1;
    } else {
      blindCount++;
    }
    setDisplay(diffStr.slice(0, Math.min(blindCount, diffStr.length)));
  }

  function press(key) {
    /* ===== 盲按阶段 ===== */
    if (phase === 'blindReady' || phase === 'blind') {
      if (key === '=') {
        const now = Date.now();
        // 500ms 内连续第二次按等号 → 定格结果
        if (eqTapTime && now - eqTapTime <= DOUBLE_EQ_MS) {
          setDisplay(TARGET_DISPLAY);
          phase = 'done';
          eqTapTime = 0;
          return;
        }
        // 第一次按等号：记录时间，并当作一次盲按推进显示
        eqTapTime = now;
        advanceBlind();
        return;
      }

      // 按了其他任意键，重置双击计时并推进一位
      eqTapTime = 0;
      advanceBlind();
      return;
    }

    /* ===== 正常输入阶段 ===== */
    if (key === 'AC' || key === 'back') {
      reset();
      return;
    }

    if (key === '+') {
      if (phase === 'A' && a !== '') {
        phase = 'B';
        setDisplay(a);
      }
      return;
    }

    if (key === '=') {
      if (phase === 'B' && a !== '' && b !== '') {
        sum = parseInt(a, 10) + parseInt(b, 10);
        const diffNum = Number(TARGET_DISPLAY) - sum;
        if (diffNum < 0) {
          diffStr = TARGET_DISPLAY;
        } else {
          diffStr = String(diffNum);
          if (PAD_DIFF_TO_TARGET_LENGTH) diffStr = diffStr.padStart(TARGET_LEN, '0');
        }
        phase = 'blindReady';
        eqTapTime = 0;
        setDisplay(String(sum));
      }
      return;
    }

    if (/^\d$/.test(key)) {
      if (phase === 'A') {
        a = a === '' ? key : (a === '0' ? key : a + key);
        setDisplay(a);
        return;
      }
      if (phase === 'B') {
        b = b === '' ? key : (b === '0' ? key : b + key);
        setDisplay(b);
        return;
      }
    }
  }

  document.querySelector('.keys').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-key]');
    if (!btn) return;
    press(btn.dataset.key);
  });

  // ===== 设置面板 =====
  function openSettings() {
    // 防穿帮：盲按阶段误触右上角图标，也视为乱按，不弹窗
    if (phase === 'blindReady' || phase === 'blind') {
      eqTapTime = 0;
      advanceBlind();
      return;
    }

    reset();
    targetInput.value = TARGET_DISPLAY;
    settingsPanel.classList.remove('hidden');
    setTimeout(() => targetInput.focus(), 50);
  }
  
  function closeSettings() {
    settingsPanel.classList.add('hidden');
  }
  
  function applyTarget() {
    const raw = targetInput.value.trim();
    if (!/^\d{1,16}$/.test(raw)) {
      targetInput.value = '';
      targetInput.placeholder = '请输入 1-16 位数字';
      return;
    }
    TARGET_DISPLAY = raw;
    TARGET_LEN = TARGET_DISPLAY.length;
    saveTarget(TARGET_DISPLAY);
    closeSettings();
    reset();
  }

  settingsBtn.addEventListener('click', openSettings);
  cancelBtn.addEventListener('click', closeSettings);
  saveBtn.addEventListener('click', applyTarget);
  targetInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') applyTarget();
    if (e.key === 'Escape') closeSettings();
  });
  settingsPanel.addEventListener('click', (e) => {
    if (e.target === settingsPanel) closeSettings();
  });

  // 初始化与适配
  fitDisplay();
  setTimeout(fitDisplay, 50);
  window.addEventListener('resize', fitDisplay);
  window.addEventListener('orientationchange', () => setTimeout(fitDisplay, 150));
</script>
</body>
</html>
